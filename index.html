<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>HotPrint 3D | Кликер</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: #0a0a0a; font-family: 'Segoe UI', system-ui, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .game { max-width: 750px; width: 100%; background: #1a1a1a; border-radius: 32px; padding: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); border: 1px solid #333; }
        .stats { background: #252525; border-radius: 20px; padding: 18px; margin-bottom: 20px; text-align: center; border: 1px solid #3a3a3a; }
        .hotprint-logo { font-size: 1.6rem; font-weight: 800; letter-spacing: 2px; background: linear-gradient(135deg, #ccc, #fff); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 8px; }
        .score { font-size: 46px; font-weight: 800; color: #f5f5f5; letter-spacing: 1px; }
        .perclick, .passive { font-size: 14px; color: #aaa; margin-top: 6px; }
        .click-btn { width: 100%; padding: 28px; background: linear-gradient(145deg, #2c2c2c, #1e1e1e); border: none; border-radius: 80px; font-size: 28px; font-weight: bold; color: white; cursor: pointer; margin-bottom: 22px; transition: 0.07s linear; box-shadow: 0 8px 0 #0a0a0a; font-family: inherit; }
        .click-btn:active { transform: translateY(4px); box-shadow: 0 4px 0 #0a0a0a; }
        
        /* Анимации скинов */
        .click-btn.skin-rainbow { background: linear-gradient(90deg, red, orange, yellow, green, cyan, blue, violet); animation: hueRotate 1s infinite; }
        .click-btn.skin-neon { background: #0ff; box-shadow: 0 0 20px #0ff; animation: pulse 0.8s infinite alternate; }
        .click-btn.skin-fire { background: linear-gradient(135deg, #ff3300, #ff6600); animation: firePulse 0.5s infinite alternate; }
        .click-btn.skin-ice { background: linear-gradient(135deg, #00ccff, #0066ff); animation: icePulse 1s infinite alternate; }
        .click-btn.skin-gold { background: linear-gradient(135deg, #ffd700, #b8860b); animation: goldShine 1s infinite; }
        .click-btn.skin-matrix { background: #0a0a0a; color: #0f0; text-shadow: 0 0 5px #0f0; }
        .click-btn.skin-hologram { background: linear-gradient(135deg, #ff00ff, #00ffff); animation: hologram 1.5s infinite; }
        .click-btn.skin-crystal { background: linear-gradient(135deg, #e0e0e0, #a0a0ff); animation: crystal 0.8s infinite alternate; }
        .click-btn.skin-lava { background: radial-gradient(circle, #ff4500, #8b0000); animation: lava 0.6s infinite alternate; }
        .click-btn.skin-galaxy { background: radial-gradient(ellipse at center, #2b005e, #000000); animation: galaxy 3s infinite; }
        .click-btn.skin-steampunk { background: linear-gradient(135deg, #8b5a2b, #cd7f32); border: 2px solid #ffd700; }
        .click-btn.skin-cyber { background: #000; border: 2px solid #0ff; box-shadow: 0 0 15px #0ff; }
        .click-btn.skin-christmas { background: linear-gradient(135deg, #ff0000, #008000); }
        .click-btn.skin-ocean { background: linear-gradient(135deg, #0066cc, #00ccff); }
        .click-btn.skin-sunset { background: linear-gradient(135deg, #ff7e5e, #feb47b); }
        .click-btn.skin-aurora { background: linear-gradient(135deg, #00ff88, #0088ff, #8800ff); background-size: 200% 200%; animation: aurora 2s infinite; }
        .click-btn.skin-plasma { background: radial-gradient(circle, #ff0080, #8000ff); animation: plasma 0.5s infinite alternate; }
        .click-btn.skin-void { background: #000; border: 2px solid #fff; animation: voidPulse 1s infinite alternate; }
        .click-btn.skin-candy { background: linear-gradient(135deg, #ff69b4, #ff1493); animation: candy 0.5s infinite alternate; }
        .click-btn.skin-forest { background: linear-gradient(135deg, #228b22, #006400); }
        .click-btn.skin-storm { background: linear-gradient(135deg, #4a4a4a, #2c2c2c); animation: storm 0.3s infinite; }
        
        @keyframes hueRotate { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }
        @keyframes pulse { 0% { box-shadow: 0 0 10px #0ff; } 100% { box-shadow: 0 0 30px #0ff; } }
        @keyframes firePulse { 0% { filter: brightness(1); } 100% { filter: brightness(1.3); } }
        @keyframes icePulse { 0% { filter: brightness(1); background-position: 0% 50%; } 100% { background-position: 100% 50%; } }
        @keyframes goldShine { 0% { filter: brightness(1); } 50% { filter: brightness(1.2); } 100% { filter: brightness(1); } }
        @keyframes hologram { 0% { opacity: 0.8; } 50% { opacity: 1; } 100% { opacity: 0.8; } }
        @keyframes crystal { 0% { filter: brightness(1); } 100% { filter: brightness(1.1) saturate(1.2); } }
        @keyframes lava { 0% { filter: brightness(1); } 100% { filter: brightness(1.15); } }
        @keyframes galaxy { 0% { background-position: 0% 0%; } 100% { background-position: 100% 100%; } }
        @keyframes aurora { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes plasma { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }
        @keyframes voidPulse { 0% { box-shadow: 0 0 5px #fff; } 100% { box-shadow: 0 0 20px #fff; } }
        @keyframes candy { 0% { filter: brightness(1); } 100% { filter: brightness(1.2); } }
        @keyframes storm { 0% { filter: brightness(1); } 100% { filter: brightness(0.8); } }
        
        .tabs { display: flex; gap: 4px; margin-bottom: 18px; flex-wrap: wrap; }
        .tab { flex: 1; padding: 8px 2px; background: #2a2a2a; border: none; border-radius: 40px; color: #ccc; cursor: pointer; font-weight: bold; font-size: 11px; }
        .tab.active { background: #555; color: white; }
        .tab-content { display: none; max-height: 450px; overflow-y: auto; }
        .tab-content.active { display: block; }
        .upgrade-item, .skin-item, .achievement-item, .casino-item, .printer-item {
            background: #252525; border-radius: 18px; padding: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; border: 1px solid #3f3f3f; cursor: pointer;
        }
        .skin-item:hover { background: #3a3a3a; }
        .upgrade-info, .skin-info { flex: 2; min-width: 120px; }
        .upgrade-name, .skin-name { font-weight: bold; color: #ddd; font-size: 13px; }
        .upgrade-desc, .skin-desc { font-size: 10px; color: #888; }
        .upgrade-price, .skin-price { font-weight: bold; color: #ffaa66; font-size: 12px; }
        .buy-btn { background: #3a3a3a; border: none; padding: 6px 14px; border-radius: 40px; color: white; cursor: pointer; font-weight: bold; font-size: 11px; }
        .buy-btn:active { transform: scale(0.96); }
        .reset-btn { background: #3a3a3a; color: #ffaa66; margin-top: 15px; width: 100%; padding: 10px; cursor: pointer; }
        .star-info { background: #2a2a2a; padding: 8px; border-radius: 20px; text-align: center; margin-bottom: 12px; font-weight: bold; color: #ffcc44; font-size: 14px; }
        .error-msg { color: #ff8866; font-size: 11px; text-align: center; margin-top: 8px; animation: fadeOut 2s forwards; }
        @keyframes fadeOut { 0% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; display: none; } }
        .name-input { width: 100%; padding: 8px; margin: 8px 0; background: #2a2a2a; border: 1px solid #555; border-radius: 30px; color: white; text-align: center; }
        .achievement-popup { position: fixed; top: 20%; left: 50%; transform: translate(-50%, -50%); background: #ffaa33; color: #1a1a1a; padding: 10px 20px; border-radius: 40px; font-weight: bold; z-index: 1000; animation: fadeOutPopup 2s forwards; }
        @keyframes fadeOutPopup { 0% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; display: none; } }
        footer { font-size: 9px; text-align: center; color: #555; margin-top: 12px; }
        .active-skin { border: 2px solid #ffaa66; background: #3a3a3a; }
    </style>
</head>
<body>
<div class="game">
    <div class="stats">
        <div class="hotprint-logo">🔧 HOTPRINT · 3D ПЕЧАТЬ</div>
        <div class="score" id="scoreDisplay">0</div>
        <div class="perclick">⚡ за клик: <span id="perClickValue">1</span></div>
        <div class="passive">🏭 деталей/сек: <span id="passiveValue">0</span></div>

    <button class="click-btn" id="clickBtn">🖨️ ПЕЧАТАТЬ</button>

    <div class="tabs">

        <button class="tab" data-tab="skins">🎨 Скины (54)</button>
        <button class="tab" data-tab="printers">🖨️ Принтеры</button>
        <button class="tab" data-tab="casino">🎰 Казино</button>
        <button class="tab" data-tab="achievements">🏆 Ачивки (100)</button>
    </div>

    <div id="upgradesTab" class="tab-content active"><div id="upgradesList"></div>
        <button id="resetProgressBtn" class="buy-btn reset-btn">♻️ СБРОСИТЬ ВСЁ</button>
        <button id="rebirthBtn" class="buy-btn reset-btn" style="margin-top:10px;">🌟 ПЕРЕРОДИТЬСЯ (10 млн | +5⭐)</button>
    </div>

    <div id="skinsTab" class="tab-content"><div id="skinsList"></div></div>

    <div id="printersTab" class="tab-content"><div id="printersList"></div>
        <div style="font-size:11px; color:#888; text-align:center; margin-top:10px;">✨ Декоративные принтеры</div>
    </div>

    <div id="casinoTab" class="tab-content">
        <div class="casino-item"><div class="upgrade-info"><div class="upgrade-name">🎲 Кость</div><div class="upgrade-desc">x2 | шанс 40%</div></div><input type="number" id="diceBet" style="background:#333; border:none; color:white; padding:4px 8px; border-radius:20px; width:100px;" value="10000"><button class="buy-btn" id="casinoDiceBtn">Играть</button></div>
        <div class="casino-item"><div class="upgrade-info"><div class="upgrade-name">🔥 Рулетка</div><div class="upgrade-desc">x3 | шанс 25%</div></div><input type="number" id="rouletteBet" style="background:#333; border:none; color:white; padding:4px 8px; border-radius:20px; width:100px;" value="50000"><button class="buy-btn" id="casinoRouletteBtn">Крутить</button></div>
        <div class="casino-item"><div class="upgrade-info"><div class="upgrade-name">💎 Слоты</div><div class="upgrade-desc">x5 | шанс 15%</div></div><input type="number" id="slotsBet" style="background:#333; border:none; color:white; padding:4px 8px; border-radius:20px; width:100px;" value="200000"><button class="buy-btn" id="casinoSlotsBtn">Запустить</button></div>
        <div class="casino-item"><div class="upgrade-info"><div class="upgrade-name">⚡ КРАШ</div><div class="upgrade-desc">x10 | шанс 8%</div></div><input type="number" id="crashBet" style="background:#333; border:none; color:white; padding:4px 8px; border-radius:20px; width:100px;" value="500000"><button class="buy-btn" id="casinoCrashBtn">КРАШНУТЬ</button></div>
        <div id="casinoMessage" style="background:#2a2a2a; padding:8px; border-radius:16px; text-align:center; margin-top:10px; color:#ffaa66;"></div>
    </div>

    <div id="achievementsTab" class="tab-content"><div id="achievementsList"></div></div>

    <footer>⭐ Звёзды за перерождение (5⭐) | Нажми на скин, чтобы применить</footer>
    <div id="errorMsg" style="height:24px;"></div>
</div>

<script>
    function formatNumber(num) {
        if (num >= 1000000) return (num / 1000000).toFixed(1) + "M";
        if (num >= 1000) return (num / 1000).toFixed(1) + "K";
        return num.toString();
    }
    
    // ========== ИГРОВЫЕ ДАННЫЕ ==========
    let score = 0, totalEarned = 0, clickPower = 1, rebirthBonus = 0, starPoints = 0;
    let currentSkin = 0;
    let playerName = localStorage.getItem('playerName') || "Гость";
    document.getElementById('playerName').value = playerName;
    document.getElementById('playerName').onchange = () => { playerName = document.getElementById('playerName').value.slice(0,20); localStorage.setItem('playerName', playerName); updateUI(); };
    
    // ========== 54 СКИНА С НАЗВАНИЯМИ ==========
    const skins = [
        { id:0, name:"⚫ Классика", class:"", price:0, bought:true },
        { id:1, name:"🌈 Радуга", class:"skin-rainbow", price:5, bought:false },
        { id:2, name:"💚 Неон", class:"skin-neon", price:8, bought:false },
        { id:3, name:"🔥 Огонь", class:"skin-fire", price:10, bought:false },
        { id:4, name:"❄️ Лёд", class:"skin-ice", price:10, bought:false },
        { id:5, name:"👑 Золото", class:"skin-gold", price:15, bought:false },
        { id:6, name:"💚 Матрица", class:"skin-matrix", price:12, bought:false },
        { id:7, name:"🌀 Голограмма", class:"skin-hologram", price:14, bought:false },
        { id:8, name:"💎 Кристалл", class:"skin-crystal", price:16, bought:false },
        { id:9, name:"🌋 Лава", class:"skin-lava", price:18, bought:false },
        { id:10, name:"🌌 Галактика", class:"skin-galaxy", price:20, bought:false },
        { id:11, name:"⚙️ Стимпанк", class:"skin-steampunk", price:22, bought:false },
        { id:12, name:"🤖 Киберпанк", class:"skin-cyber", price:25, bought:false },
        { id:13, name:"🎄 Рождество", class:"skin-christmas", price:20, bought:false },
        { id:14, name:"🌊 Океан", class:"skin-ocean", price:15, bought:false },
        { id:15, name:"🌅 Закат", class:"skin-sunset", price:18, bought:false },
        { id:16, name:"✨ Аврора", class:"skin-aurora", price:25, bought:false },
        { id:17, name:"⚡ Плазма", class:"skin-plasma", price:30, bought:false },
        { id:18, name:"🕳️ Бездна", class:"skin-void", price:35, bought:false },
        { id:19, name:"🍭 Конфетный взрыв", class:"skin-candy", price:28, bought:false },
        { id:20, name:"🌲 Тёмный лес", class:"skin-forest", price:20, bought:false },
        { id:21, name:"⛈️ Грозовой", class:"skin-storm", price:22, bought:false },
        { id:22, name:"🎃 Хэллоуин", class:"skin-fire", price:25, bought:false },
        { id:23, name:"💀 Некромант", class:"skin-void", price:40, bought:false },
        { id:24, name:"🐉 Драконий", class:"skin-fire", price:45, bought:false },
        { id:25, name:"🌸 Сакура", class:"skin-candy", price:20, bought:false },
        { id:26, name:"🎆 Фейерверк", class:"skin-rainbow", price:30, bought:false },
        { id:27, name:"🕯️ Свечной", class:"skin-gold", price:18, bought:false },
        { id:28, name:"🧪 Лаборатория", class:"skin-neon", price:25, bought:false },
        { id:29, name:"⚜️ Византийский", class:"skin-gold", price:35, bought:false },
        { id:30, name:"🌙 Лунный", class:"skin-ice", price:28, bought:false },
        { id:31, name:"☀️ Солнечный", class:"skin-fire", price:28, bought:false },
        { id:32, name:"🕷️ Паутина", class:"skin-void", price:32, bought:false },
        { id:33, name:"🧊 Арктика", class:"skin-ice", price:25, bought:false },
        { id:34, name:"🏜️ Пустыня", class:"skin-sunset", price:22, bought:false },
        { id:35, name:"🌋 Вулкан", class:"skin-lava", price:30, bought:false },
        { id:36, name:"🧠 ИИ", class:"skin-cyber", price:35, bought:false },
        { id:37, name:"💀 Смерть", class:"skin-void", price:50, bought:false },
        { id:38, name:"👻 Призрак", class:"skin-hologram", price:28, bought:false },
        { id:39, name:"🐺 Оборотень", class:"skin-forest", price:30, bought:false },
        { id:40, name:"🧛 Вампир", class:"skin-plasma", price:35, bought:false },
        { id:41, name:"🧙 Маг", class:"skin-galaxy", price:40, bought:false },
        { id:42, name:"🏴‍☠️ Пират", class:"skin-ocean", price:25, bought:false },
        { id:43, name:"🤠 Ковбой", class:"skin-sunset", price:22, bought:false },
        { id:44, name:"👮 Полицейский", class:"skin-cyber", price:20, bought:false },
        { id:45, name:"🧑‍🚀 Космонавт", class:"skin-galaxy", price:30, bought:false },
        { id:46, name:"🦸 Супергерой", class:"skin-rainbow", price:35, bought:false },
        { id:47, name:"🦹 Злодей", class:"skin-plasma", price:35, bought:false },
        { id:48, name:"🧸 Плюшевый", class:"skin-candy", price:15, bought:false },
        { id:49, name:"🍕 Пицца", class:"skin-sunset", price:18, bought:false },
        { id:50, name:"🎮 Геймер", class:"skin-neon", price:25, bought:false },
        { id:51, name:"🎸 Рокер", class:"skin-fire", price:28, bought:false },
        { id:52, name:"🧘 Дзен", class:"skin-ice", price:20, bought:false },
        { id:53, name:"🏆 Чемпион", class:"skin-gold", price:40, bought:false }
    ];
    
    // Принтеры
    const printers = [
        { id:0, name:"🖨️ Prusa MK4", desc:"Надёжный", price:5000, bought:false },
        { id:1, name:"🚀 Bambu Lab X1C", desc:"Сверхбыстрый", price:15000, bought:false },
        { id:2, name:"🏭 Creality K1", desc:"Скоростной", price:25000, bought:false },
        { id:3, name:"💎 Voron 2.4", desc:"Самосборка", price:50000, bought:false },
        { id:4, name:"👑 RatRig V-Core", desc:"Промышленный", price:100000, bought:false }
    ];
    
    // 20 улучшений
    const upgrades = [];
    const names = ["🖨️ Экструдер","🔧 PLA-филамент","⚙️ Сопло 0.2","💨 Обдув","🏭 Двойной экструдер","🚀 Скорость","🌀 Автокалибровка","💎 Алмазное сопло","🛸 Умный слайсер","👑 Ферма","🎯 Лазер","🌡️ Нагретый стол","📡 Облачная печать","🤖 ИИ-оптимизация","⚡ Прямой привод","🧬 PETG","🌀 Стабилизация","🌌 Нейросеть","💿 Карбон","✨ Левитация"];
    for (let i = 0; i < 20; i++) {
        let basePrice = 80 + i * 35;
        let power = i < 10 ? Math.floor((i+1) * 0.7) : Math.floor((i-9) * 1.2 + 4);
        if (power < 1) power = 1;
        let type = (i % 2 === 0) ? "click" : "passive";
        upgrades.push({ id: i, name: names[i], desc: `+${power} ${type === "click" ? "за клик" : "дет/сек"}`, basePrice, power, type, level: 0 });
    }
    
    // ========== 100 АЧИВОК С НАЗВАНИЯМИ ==========
    let achievements = [];
    const achNames = [
        "Первый шаг", "100 кликов", "1000 кликов", "Первый миллион", "Миллиардер",
        "Любитель скинов", "Коллекционер", "Мастер скинов", "Первое перерождение", "Инженер",
        "Механик", "Профессор", "Гуру", "Легенда", "Мировой судья",
        "Космический странник", "Повелитель принтеров", "Азартный игрок", "Везунчик", "Неудачник",
        "Инвестор", "Магнат", "Олигарх", "Триллионер", "Бесконечность",
        "Скорость света", "Сверхзвуковой", "Реактивный", "Космический", "Божественный",
        "Мастер кликов", "Грандмастер", "Элитный кликер", "Повелитель кликов", "Бог кликов",
        "Собиратель звёзд", "Звёздный", "Астральный", "Галактический", "Вселенский",
        "Хранитель времени", "Разрушитель рекордов", "Легендарный", "Мифический", "Бессмертный",
        "Покоритель миров", "Властелин вселенной", "Абсолют", "Нулевой", "Финал"
    ];
    for(let i=0; i<100; i++) {
        let name = achNames[i % achNames.length] + (i >= achNames.length ? ` ${Math.floor(i/achNames.length)+1}` : "");
        let target = i < 10 ? 1000 * (i+1) : 1000000 * (i-9);
        achievements.push({ id:i, name:name, target:target, current:0, unlocked:false });
    }
    
    let totalUpgradeLevels = 0, skinsBoughtCount = 1, clickCount = 0;
    
    function getUpgradePrice(up) { return Math.floor(up.basePrice * Math.pow(1.28, up.level)); }
    
    function recalcPower() {
        let baseClick = 1;
        for (let u of upgrades) if (u.type === "click") baseClick += u.power * u.level;
        let multiplier = 1 + (rebirthBonus / 100);
        clickPower = Math.floor(baseClick * multiplier);
        if (clickPower < 1) clickPower = 1;
        return clickPower;
    }
    
    function getPassiveIncome() {
        let passive = 0;
        for (let u of upgrades) if (u.type === "passive") passive += u.power * u.level;
        return passive;
    }
    
    function applySkin() {
        let skin = skins.find(s => s.id === currentSkin);
        let btn = document.getElementById('clickBtn');
        if (skin && skin.class) btn.className = "click-btn " + skin.class;
        else btn.className = "click-btn";
    }
    
    function showError(msg) {
        let errDiv = document.getElementById('errorMsg');
        errDiv.innerHTML = `<div class="error-msg">⚠️ ${msg}</div>`;
        setTimeout(() => { if(errDiv.firstChild) errDiv.firstChild.remove(); }, 2000);
    }
    
    function updateUI() {
        document.getElementById('scoreDisplay').innerHTML = formatNumber(Math.floor(score));
        document.getElementById('perClickValue').innerText = clickPower;
        document.getElementById('passiveValue').innerText = getPassiveIncome();
        document.getElementById('starPoints').innerText = starPoints;
        
        const upgradesDiv = document.getElementById('upgradesList');
        upgradesDiv.innerHTML = '';
        for (let up of upgrades) {
            let price = getUpgradePrice(up);
            let div = document.createElement('div');
            div.className = 'upgrade-item';
            div.innerHTML = `<div class="upgrade-info"><div class="upgrade-name">${up.name} (ур.${up.level})</div><div class="upgrade-desc">${up.desc}</div></div><div class="upgrade-price">💰 ${formatNumber(price)}</div><button class="buy-btn" data-id="${up.id}">Купить</button>`;
            upgradesDiv.appendChild(div);
        }
        
        const skinsDiv = document.getElementById('skinsList');
        skinsDiv.innerHTML = '';
        for (let s of skins) {
            let div = document.createElement('div');
            div.className = 'skin-item' + (currentSkin === s.id ? ' active-skin' : '');
            div.innerHTML = `<div class="skin-info"><div class="skin-name">${s.name} ${s.bought ? '✅' : ''}</div><div class="skin-desc">⭐ ${s.price}</div></div>${!s.bought ? `<button class="buy-btn" data-skin="${s.id}">Купить</button>` : '<span>Применить</span>'}`;
            div.onclick = (e) => {
                if(e.target.tagName !== 'BUTTON') {
                    if(s.bought) { currentSkin = s.id; applySkin(); updateUI(); saveGame(); showError(`✨ Скин "${s.name}" применён!`); }
                }
            };
            skinsDiv.appendChild(div);
        }
        
        const printersDiv = document.getElementById('printersList');
        printersDiv.innerHTML = '';
        for (let p of printers) {
            let div = document.createElement('div');
            div.className = 'printer-item';
            div.innerHTML = `<div class="upgrade-info"><div class="upgrade-name">${p.name} ${p.bought ? '✅' : ''}</div><div class="upgrade-desc">${p.desc}</div></div><div class="upgrade-price">💰 ${formatNumber(p.price)}</div>${!p.bought ? `<button class="buy-btn" data-printer="${p.id}">Купить</button>` : '<span>Куплен</span>'}`;
            printersDiv.appendChild(div);
        }
        
        document.querySelectorAll('[data-id]').forEach(btn => btn.onclick = (e) => { e.stopPropagation(); buyUpgrade(parseInt(btn.dataset.id)); });
        document.querySelectorAll('[data-skin]').forEach(btn => btn.onclick = (e) => { e.stopPropagation(); buySkin(parseInt(btn.dataset.skin)); });
        document.querySelectorAll('[data-printer]').forEach(btn => btn.onclick = (e) => { e.stopPropagation(); buyPrinter(parseInt(btn.dataset.printer)); });
        updateAchievementsUI();
    }
    
    function buyUpgrade(id) {
        let up = upgrades.find(u => u.id === id);
        let price = getUpgradePrice(up);
        if (score >= price) { score -= price; up.level++; totalUpgradeLevels++; recalcPower(); updateUI(); saveGame(); }
        else showError(`Не хватает ${formatNumber(price - score)}`);
    }
    
    function buySkin(id) {
        let skin = skins.find(s => s.id === id);
        if (skin.bought) return;
        if (starPoints >= skin.price) { starPoints -= skin.price; skin.bought = true; skinsBoughtCount++; updateUI(); saveGame(); }
        else showError(`Нужно ${skin.price - starPoints}⭐`);
    }
    
    function buyPrinter(id) {
        let printer = printers.find(p => p.id === id);
        if (printer.bought) return;
        if (score >= printer.price) { score -= printer.price; printer.bought = true; updateUI(); saveGame(); }
        else showError(`Не хватает ${formatNumber(printer.price - score)}`);
    }
    
    function performRebirth() {
        if (totalEarned >= 10000000) {
            let bonusGain = Math.floor(totalEarned / 10000000) * 5;
            rebirthBonus += bonusGain;
            starPoints += 5;
            score = 0; totalEarned = 0;
            for (let up of upgrades) up.level = 0;
            totalUpgradeLevels = 0;
            recalcPower(); updateUI(); saveGame(); checkAchievements();
            alert(`🌟 Перерождение! +${bonusGain}% к клику, +5⭐!`);
        } else showError(`Нужно 10 млн деталей. Не хватает ${formatNumber(10000000 - totalEarned)}`);
    }
    
    function handleClick() {
        let gain = clickPower;
        score += gain; totalEarned += gain; clickCount++;
        updateUI(); saveGame(); checkAchievements();
        let btn = document.getElementById('clickBtn');
        btn.style.transform = 'scale(0.96)';
        setTimeout(() => btn.style.transform = '', 90);
    }
    
    function casinoGame(betInputId, multiplier, chancePercent) {
        let bet = parseInt(document.getElementById(betInputId).value);
        if (isNaN(bet) || bet <= 0 || bet > score) { showError("Недостаточно деталей!"); return; }
        let win = Math.random() * 100 < chancePercent;
        if (win) { score += bet * multiplier; showError(`🎉 +${formatNumber(bet * multiplier)}!`); }
        else { score -= bet; showError(`😞 -${formatNumber(bet)}`); }
        updateUI(); saveGame();
    }
    
    function checkAchievements() {
        for (let a of achievements) {
            if (!a.unlocked && totalEarned >= a.target) {
                a.unlocked = true;
                let popup = document.createElement('div');
                popup.className = 'achievement-popup';
                popup.innerText = `🏆 ${a.name}!`;
                document.body.appendChild(popup);
                setTimeout(() => popup.remove(), 2000);
                updateAchievementsUI();
                saveGame();
            }
        }
    }
    
    function updateAchievementsUI() {
        const container = document.getElementById('achievementsList');
        if (!container) return;
        container.innerHTML = '';
        for (let a of achievements) {
            let div = document.createElement('div');
            div.className = 'achievement-item';
            div.innerHTML = `<div class="upgrade-info"><div class="upgrade-name">${a.name} ${a.unlocked ? '✅' : '🔒'}</div></div><div>${formatNumber(Math.min(a.current, a.target))}/${formatNumber(a.target)}</div>`;
            container.appendChild(div);
        }
    }
    
    function resetFullProgress() { if(confirm("Сбросить ВСЁ?")){ localStorage.clear(); location.reload(); } }
    
    function saveGame() {
        let saveObj = { score, totalEarned, clickPower, rebirthBonus, starPoints, currentSkin, playerName,
            upgrades: upgrades.map(u => ({ id: u.id, level: u.level })),
            skins: skins.map(s => ({ id: s.id, bought: s.bought })),
            printers: printers.map(p => ({ id: p.id, bought: p.bought })),
            achievements: achievements.map(a => ({ id: a.id, current: a.current, unlocked: a.unlocked })),
            totalUpgradeLevels, skinsBoughtCount, clickCount };
        localStorage.setItem('clickerProSave', JSON.stringify(saveObj));
    }
    
    function loadGame() {
        let raw = localStorage.getItem('clickerProSave');
        if (!raw) return false;
        try {
            let data = JSON.parse(raw);
            score = data.score || 0; totalEarned = data.totalEarned || 0; clickPower = data.clickPower || 1;
            rebirthBonus = data.rebirthBonus || 0; starPoints = data.starPoints || 0; currentSkin = data.currentSkin || 0;
            playerName = data.playerName || "Гость";
            if (data.upgrades) for (let s of data.upgrades) { let up = upgrades.find(u => u.id === s.id); if (up) up.level = s.level; }
            if (data.skins) for (let sk of data.skins) { let t = skins.find(s => s.id === sk.id); if (t) t.bought = sk.bought; }
            if (data.printers) for (let pr of data.printers) { let p = printers.find(prn => prn.id === pr.id); if (p) p.bought = pr.bought; }
            if (data.achievements) for (let a of data.achievements) { let ach = achievements.find(ac => ac.id === a.id); if (ach) { ach.current = a.current; ach.unlocked = a.unlocked; } }
            totalUpgradeLevels = data.totalUpgradeLevels || 0; skinsBoughtCount = data.skinsBoughtCount || 1; clickCount = data.clickCount || 0;
            document.getElementById('playerName').value = playerName;
            recalcPower(); applySkin(); updateUI(); return true;
        } catch(e) { return false; }
    }
    
    loadGame(); recalcPower(); applySkin(); updateUI();
    setInterval(() => { let inc = getPassiveIncome(); if (inc > 0) { score += inc; totalEarned += inc; updateUI(); saveGame(); } }, 1000);
    document.getElementById('clickBtn').onclick = handleClick;
    document.getElementById('resetProgressBtn').onclick = resetFullProgress;
    document.getElementById('rebirthBtn').onclick = performRebirth;
    document.getElementById('casinoDiceBtn').onclick = () => casinoGame('diceBet', 2, 40);
    document.getElementById('casinoRouletteBtn').onclick = () => casinoGame('rouletteBet', 3, 25);
    document.getElementById('casinoSlotsBtn').onclick = () => casinoGame('slotsBet', 5, 15);
    document.getElementById('casinoCrashBtn').onclick = () => casinoGame('crashBet', 10, 8);
    
    document.querySelectorAll('.tab').forEach(tab => {
        tab.onclick = () => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            tab.classList.add('active');
            document.getElementById(tab.dataset.tab + 'Tab').classList.add('active');
        };
    });
</script>
</body>
</html>
